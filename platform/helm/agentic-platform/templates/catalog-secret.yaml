{{/* Secret for the catalog: holds DB password (when not pulled from
     an existing secret) plus any future at-rest values. */}}
{{- if and .Values.database.external.enabled (not .Values.database.external.existingSecret) (not .Values.database.external.connectionString) }}
{{- if .Values.database.external.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-catalog-db
  labels:
    {{- include "agentic-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.database.external.password | quote }}
{{- end }}
{{- end }}
