{{- if and .Values.opsConsole.enabled .Values.opsConsole.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ops-console
  labels:
    {{- include "agentic-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: ops-console
  {{- with .Values.opsConsole.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.opsConsole.ingress.className }}
  {{- if .Values.opsConsole.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.opsConsole.ingress.host }}
      secretName: {{ .Values.opsConsole.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.opsConsole.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-ops-console
                port:
                  number: {{ .Values.opsConsole.service.port }}
{{- end }}
