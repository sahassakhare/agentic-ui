# Production — Oracle. Set DB env vars; auth on; seed off.
spring:
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@127.0.0.1:1521/FREEPDB1}
    username: ${DB_USER:catalog}
    password: ${DB_PASSWORD:catalog}
    driver-class-name: oracle.jdbc.OracleDriver
  flyway:
    locations: classpath:db/migration/oracle

catalog:
  auth:
    mode: ${CATALOG_AUTH_MODE:oidc}
    issuer: ${OIDC_ISSUER:http://127.0.0.1:9100}
    audience: ${OIDC_AUDIENCE:agentic-catalog}
  seed:
    enabled: ${CATALOG_SEED:false}
