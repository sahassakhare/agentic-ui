name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel an in-flight run for the same ref when a new push lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build + test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Pin to Angular 21's supported LTS Node versions. Add 22.x once stable
        # and the toolchain catches up.
        node: ['20.19']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Pin npm to match the lockfile generator. Node 20.19 ships
      # npm 10.8.2, but the workspace's package-lock.json is
      # lockfileVersion 3 generated by npm 11+, which encodes
      # platform-specific optionalDependencies (e.g.
      # @rspack/binding-win32-*) in a form npm 10 reads as
      # "missing from lock". Pinning to 11.x keeps `npm ci`
      # deterministic.
      - name: Pin npm to 11.x (matches lockfile generator)
        run: npm install -g npm@11.6.2

      - name: Install workspace dependencies
        run: npm ci --no-audit --fund=false

      - name: Build the library (primary entry + schematics)
        run: npm run build:lib

      - name: Link the freshly built lib into node_modules
        run: npm install ./dist/agentic-ui --no-save

      # examples/demo-ediscovery-shared is a private workspace package
      # consumed by demo-ediscovery-{shell,review,production,search} and
      # demo-ediscovery-server. Its dist/ is gitignored, but the root
      # tsconfig.json's `@maverick/demo-ediscovery-shared` path alias
      # resolves to dist/index, so any subsequent `ng build` (including
      # demo-shell, demo-monolith, etc., which scan workspace tsconfig
      # paths via the Angular CLI) needs dist/ to exist on disk.
      - name: Build demo-ediscovery-shared (TypeScript shared package)
        working-directory: examples/demo-ediscovery-shared
        run: |
          npm install --no-audit --fund=false
          npm run build

      - name: Unit tests (Vitest via @angular/build:unit-test)
        run: npx ng test agentic-ui --no-watch

      - name: Build demo-monolith (production)
        run: npx ng build demo-monolith --configuration=production

      - name: Build demo-multi-agent (production)
        run: npx ng build demo-multi-agent --configuration=production

      - name: Build demo-feature-tour (production)
        run: npx ng build demo-feature-tour --configuration=production

      - name: Build demo-shell (production, Native Federation host)
        run: npx ng build demo-shell --configuration=production

      - name: Build demo-remote-bookings (production, Native Federation remote)
        run: npx ng build demo-remote-bookings --configuration=production

      - name: Build demo-remote-loyalty (production, Native Federation remote)
        run: npx ng build demo-remote-loyalty --configuration=production

      - name: Build demo-remote-support (production, Native Federation remote)
        run: npx ng build demo-remote-support --configuration=production

      # demo-server imports @maverick/agentic-ui-server (workspace pkg).
      # Build it before compiling demo-server so the consumer's
      # `import {...} from '@maverick/agentic-ui-server'` resolves.
      - name: Build @maverick/agentic-ui-server (TypeScript)
        working-directory: projects/agentic-ui-server
        run: npm run build

      # @maverick/agentic-ui-server-stores ships Redis + Postgres adapters
      # for ThreadStateStore (ADR-012, M1 R3). Sibling package; uses
      # `file:../agentic-ui-server` for its devDep, so install only
      # works AFTER agentic-ui-server is built. Run unit tests too —
      # they exercise the adapter logic against mocked clients.
      - name: Install + build + test @maverick/agentic-ui-server-stores
        working-directory: projects/agentic-ui-server-stores
        run: |
          npm install --no-audit --fund=false
          npm run build
          npm test

      # @maverick/agentic-catalog-server — control-plane T2 foundation
      # (ADR-015, M2 C1). Standalone package under platform/. No file:
      # peer deps, so install + build + test in any order.
      - name: Install + build + test @maverick/agentic-catalog-server
        working-directory: platform/agentic-catalog-server
        run: |
          npm install --no-audit --fund=false
          npm run build
          npm test

      - name: Compile demo-server (TypeScript → dist/)
        working-directory: examples/demo-server
        run: |
          npm ci --no-audit --fund=false
          npx tsc -p tsconfig.json

      - name: Bundle-size guard (lib FESM under 300 KB)
        run: |
          # Cap raised from 200 KB → 300 KB to accommodate F1–F6:
          #   F1 form-renderer + composition store + closed-AST DSL evaluator
          #   F4 ApprovalRegistry + ApprovalCardComponent
          #   F5 OperationRegistry + OperationProgressComponent
          #   F6 MessageContent union + multi-modal composer affordances
          # Pre-F1 baseline ~140 KB; post-F6 ~258 KB. The 300 KB cap leaves
          # headroom for one more capability slice before the next budget
          # review. Lower this back if a refactor materially shrinks the
          # surface.
          size=$(wc -c < dist/agentic-ui/fesm2022/maverick-agentic-ui.mjs)
          echo "FESM size: $size bytes"
          if [ "$size" -gt 307200 ]; then
            echo "::error::Lib FESM exceeded 300 KB ($size B). Investigate before merging."
            exit 1
          fi

      - name: Build TypeDoc API site
        run: npm run docs:api

      - name: Build Compodoc site
        run: npm run docs:compodoc
