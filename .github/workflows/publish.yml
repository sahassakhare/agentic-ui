          v=$(node -p "require('./package.json').version")
          if npm view "@infra-tools/agentic-ui-server-registrar@$v" version >/dev/null 2>&1; then
            echo "::notice::@infra-tools/agentic-ui-server-registrar@$v already published — skipping"
          else
