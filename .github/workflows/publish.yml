name: publish

# Publishes the four @infra-tools packages to npm from CI, where:
#   - GitHub Actions is a supported OIDC provider, so npm provenance
#     attestations work (the publishConfig.provenance:true on agentic-ui
#     and agentic-ui-server is honoured — it fails on a local publish).
#   - The NPM_TOKEN repo secret is an npm *Automation* token, which
#     bypasses the account's publish-time 2FA requirement.
#
# Each step is idempotent: a version already on npm is skipped, so a
# re-run only publishes what's new. Trigger manually (Actions -> publish
# -> Run workflow) or automatically on a GitHub Release.

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm provenance (OIDC)

jobs:
  publish:
    name: Publish @infra-tools/* to npm
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20.19 (+ npm registry auth)
        uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Match the lockfile generator (see .github/workflows/ci.yml).
      - name: Pin npm to 11.x
        run: npm install -g npm@11.6.2

      - name: Install workspace dependencies
        run: npm ci --no-audit --fund=false

      - name: Build the library (primary entry + schematics)
        run: npm run build:lib

      # Consumer packages import '@infra-tools/agentic-ui'; link the freshly
      # built dist into node_modules so their tsc builds resolve it (mirrors
      # the same step in ci.yml). Without this, agentic-ui-mcp et al. fail
      # with TS2307 "Cannot find module '@infra-tools/agentic-ui'".
      - name: Link the freshly built lib into node_modules
        run: npm install ./dist/agentic-ui --no-save

      # --- publishes -------------------------------------------------------
      # Shared guard: skip if this exact version is already on npm, so the
      # workflow is safe to re-run.
      - name: Publish @infra-tools/agentic-ui
        working-directory: dist/agentic-ui
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "@infra-tools/agentic-ui@$v" version >/dev/null 2>&1; then
            echo "::notice::@infra-tools/agentic-ui@$v already published — skipping"
          else
            npm publish --access public
          fi

      - name: Build + publish @infra-tools/agentic-ui-server
        working-directory: projects/agentic-ui-server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm run build
          v=$(node -p "require('./package.json').version")
          if npm view "@infra-tools/agentic-ui-server@$v" version >/dev/null 2>&1; then
            echo "::notice::@infra-tools/agentic-ui-server@$v already published — skipping"
          else
            npm publish --access public
          fi

      - name: Build + publish @infra-tools/agentic-platform-schematics
        working-directory: projects/agentic-platform-schematics
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm run build
          v=$(node -p "require('./package.json').version")
          if npm view "@infra-tools/agentic-platform-schematics@$v" version >/dev/null 2>&1; then
            echo "::notice::@infra-tools/agentic-platform-schematics@$v already published — skipping"
          else
            npm publish --access public
          fi

      - name: Build + publish @infra-tools/agentic-catalog-server
        working-directory: platform/agentic-catalog-server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install --no-audit --fund=false
          npm run build
          v=$(node -p "require('./package.json').version")
          if npm view "@infra-tools/agentic-catalog-server@$v" version >/dev/null 2>&1; then
            echo "::notice::@infra-tools/agentic-catalog-server@$v already published — skipping"
          else
            npm publish --access public
          fi

      - name: Build + publish @infra-tools/agentic-ui-mcp
        working-directory: projects/agentic-ui-mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm run build
          v=$(node -p "require('./package.json').version")
          if npm view "@infra-tools/agentic-ui-mcp@$v" version >/dev/null 2>&1; then
            echo "::notice::@infra-tools/agentic-ui-mcp@$v already published — skipping"
          else
            npm publish --access public
          fi

      - name: Build + publish @infra-tools/agentic-ui-opa-authorizer
        working-directory: projects/agentic-ui-opa-authorizer
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm run build
          v=$(node -p "require('./package.json').version")
          if npm view "@infra-tools/agentic-ui-opa-authorizer@$v" version >/dev/null 2>&1; then
            echo "::notice::@infra-tools/agentic-ui-opa-authorizer@$v already published — skipping"
          else
            npm publish --access public
          fi

      - name: Build + publish @infra-tools/aep-embed-sdk
        working-directory: platform/aep-embed-sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm run build
          v=$(node -p "require('./package.json').version")
          if npm view "@infra-tools/aep-embed-sdk@$v" version >/dev/null 2>&1; then
            echo "::notice::@infra-tools/aep-embed-sdk@$v already published — skipping"
          else
            npm publish --access public
          fi

      - name: Build + publish @infra-tools/mvk (mvk-cli)
        working-directory: platform/mvk-cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm run build
          v=$(node -p "require('./package.json').version")
          if npm view "@infra-tools/mvk@$v" version >/dev/null 2>&1; then
            echo "::notice::@infra-tools/mvk@$v already published — skipping"
          else
            npm publish --access public
          fi
