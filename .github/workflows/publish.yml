name: publish

# Publishes one or more @infra-tools/* packages to npm.
#
# ── How to publish ─────────────────────────────────────────────────────────
#  Bump the package's version in its package.json, commit, and either:
#
#    1. Manual run from GitHub UI (recommended for first-time):
#         Actions → "publish" → Run workflow
#         · Pick which package(s) to publish (default: all that need publishing)
#         · Tick `dry_run` to test the workflow without pushing to npm
#
#    2. Automatic on a release:
#         Create a GitHub release whose tag follows one of:
#           agentic-ui-v1.1.0                              → @infra-tools/agentic-ui
#           agentic-ui-server-v0.1.0                       → @infra-tools/agentic-ui-server
#           agentic-ui-mcp-v0.1.0                          → @infra-tools/agentic-ui-mcp
#           agentic-ui-copilot-skill-v0.1.0                → @infra-tools/agentic-ui-copilot-skill
#           agentic-ui-teams-bot-v0.1.0                    → @infra-tools/agentic-ui-teams-bot
#           agentic-ui-m365-agents-v0.1.0                  → @infra-tools/agentic-ui-m365-agents
#           agentic-ui-copilot-studio-connector-v0.1.0     → @infra-tools/agentic-ui-copilot-studio-connector
#           agentic-ui-webmcp-v0.1.0                       → @infra-tools/agentic-ui-webmcp
#         The workflow detects the prefix and publishes only that package.
#         (`v1.1.0` without a prefix also works — defaults to agentic-ui.)
#
# ── One-time setup (per repo) ──────────────────────────────────────────────
#  Generate an npm Automation Token (npmjs.com → Access Tokens → Generate
#  New Token → Automation). Grant publish access to the @infra-tools scope.
#  Add it to GitHub: Settings → Secrets and variables → Actions → New
#  repository secret → name `NPM_TOKEN`, value <token>.
#
#  Once the first publish succeeds you can switch to npm Trusted Publishing
#  (npmjs.com → package settings → Trusted publishing → add this repo +
#  this workflow file). After that, NPM_TOKEN is no longer required — the
#  OIDC token this workflow already requests provides authentication, and
#  provenance attestations are stronger.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package:
        description: "Which package to publish (`all` runs every package; already-published versions are skipped)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - agentic-ui
          - agentic-ui-server
          - agentic-ui-mcp
          - agentic-ui-copilot-skill
          - agentic-ui-teams-bot
          - agentic-ui-m365-agents
          - agentic-ui-copilot-studio-connector
          - agentic-ui-server-stores
          - agentic-ui-server-registrar
          - agentic-ui-opa-authorizer
          - agentic-ui-webmcp
      dry_run:
        description: "Dry run — build + `npm publish --dry-run`, but don't push to npm"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write   # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # `inputs.dry_run` is only set for workflow_dispatch; defaults to "false"
      # (string) for release-triggered runs.
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20.19 (matches CI matrix)
        uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: npm
          # Configures ~/.npmrc with the auth token line for npm publish
          registry-url: 'https://registry.npmjs.org'

      # Match ci.yml: pin npm to 11.x so the workspace's lockfileVersion-3
      # lockfile (generated by npm 11) reads as in-sync.
      - name: Pin npm to 11.x (matches lockfile generator)
        run: npm install -g npm@11.6.2

      - name: Install workspace dependencies
        run: npm ci --no-audit --fund=false

      - name: Decide which packages to publish
        id: target
        run: |
          # Resolve the trigger source into a space-separated list of packages.
          # Spaces around the list let downstream steps do exact-word matching
          # via bash globbing (`*" agentic-ui "*`) — substring-style matching
          # in YAML `contains()` would treat `agentic-ui` as a prefix of
          # `agentic-ui-server` and false-positive.
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
            case "$tag" in
              agentic-ui-copilot-studio-connector-v*)  pkgs="agentic-ui-copilot-studio-connector" ;;
              agentic-ui-copilot-skill-v*)             pkgs="agentic-ui-copilot-skill" ;;
              agentic-ui-teams-bot-v*)                 pkgs="agentic-ui-teams-bot" ;;
              agentic-ui-m365-agents-v*)               pkgs="agentic-ui-m365-agents" ;;
              agentic-ui-server-stores-v*)             pkgs="agentic-ui-server-stores" ;;
              agentic-ui-server-registrar-v*)          pkgs="agentic-ui-server-registrar" ;;
              agentic-ui-opa-authorizer-v*)            pkgs="agentic-ui-opa-authorizer" ;;
              agentic-ui-webmcp-v*)                    pkgs="agentic-ui-webmcp" ;;
              agentic-ui-server-v*)                    pkgs="agentic-ui-server" ;;
              agentic-ui-mcp-v*)                       pkgs="agentic-ui-mcp" ;;
              agentic-ui-v*)                           pkgs="agentic-ui" ;;
              v*)                                      pkgs="agentic-ui" ;;       # legacy default
              *)
                echo "::error::Unrecognised tag format: $tag"
                exit 1
                ;;
            esac
          else
            case "${{ inputs.package }}" in
              all) pkgs="agentic-ui agentic-ui-server agentic-ui-mcp agentic-ui-copilot-skill agentic-ui-teams-bot agentic-ui-m365-agents agentic-ui-copilot-studio-connector agentic-ui-server-stores agentic-ui-server-registrar agentic-ui-opa-authorizer agentic-ui-webmcp" ;;
              *)   pkgs="${{ inputs.package }}" ;;
            esac
          fi
          echo "Publishing: $pkgs"
          echo "pkgs=$pkgs" >> "$GITHUB_OUTPUT"

      # Fail fast with a clear, actionable message if the npm credentials
      # aren't usable. Without this, `npm publish` exits with a generic
      # ENEEDAUTH / EUNAUTHORIZED ~4 s later and the workflow's failure
      # looks ambiguous. Skipped on dry-run and when NPM_TOKEN is empty —
      # the empty-token path is valid IF npm Trusted Publishing has been
      # configured for every @infra-tools/* package (the OIDC token
      # request the publish step makes covers it).
      - name: Verify npm credentials (when NPM_TOKEN is set)
        if: env.DRY_RUN != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::notice::NPM_TOKEN secret is empty — assuming npm Trusted Publishing is configured for every @infra-tools/* package. If publish fails with ENEEDAUTH, either set NPM_TOKEN or finish enrolling Trusted Publishing for the failing package(s)."
            exit 0
          fi
          if ! who=$(npm whoami 2>&1); then
            echo "::error::npm whoami failed — NPM_TOKEN is invalid, expired, or revoked."
            echo "::error::Regenerate at npmjs.com → Access Tokens → Generate New Token (Automation), grant publish access to the @infra-tools scope, and update the NPM_TOKEN repository secret."
            echo "npm whoami output:"
            echo "$who"
            exit 1
          fi
          echo "Authenticated to npm as: $who"

      - name: Build all libraries (dependency order)
        run: |
          # Always build everything — small enough that conditional builds
          # aren't worth the complexity. Per-package skip happens at publish.
          npm run build:lib
          # Packages with `file:` cross-deps on workspace siblings need a
          # local npm install AFTER the dep is built, so tsc can resolve
          # the renamed `@infra-tools/agentic-ui*` specifier from their
          # node_modules:
          #   agentic-ui-mcp        → @infra-tools/agentic-ui     (file:../../dist/agentic-ui)
          #   agentic-ui-opa-authorizer → @infra-tools/agentic-ui (file:../../dist/agentic-ui)
          npm --prefix projects/agentic-ui-mcp                      install --no-audit --fund=false
          npm --prefix projects/agentic-ui-opa-authorizer           install --no-audit --fund=false
          npm --prefix projects/agentic-ui-server                   run build
          # server-stores depends on the just-built agentic-ui-server.
          npm --prefix projects/agentic-ui-server-stores            install --no-audit --fund=false
          npm --prefix projects/agentic-ui-mcp                      run build
          npm --prefix projects/agentic-ui-copilot-skill            run build
          npm --prefix projects/agentic-ui-teams-bot                run build
          npm --prefix projects/agentic-ui-m365-agents              install --no-audit --fund=false
          npm --prefix projects/agentic-ui-m365-agents              run build
          npm --prefix projects/agentic-ui-copilot-studio-connector run build
          npm --prefix projects/agentic-ui-server-stores            run build
          npm --prefix projects/agentic-ui-server-registrar         run build
          npm --prefix projects/agentic-ui-opa-authorizer           run build
          # webmcp depends on the just-built dist/agentic-ui (file: ref).
          npm --prefix projects/agentic-ui-webmcp                    install --no-audit --fund=false
          npm --prefix projects/agentic-ui-webmcp                    run build

      # Single loop replaces 10 near-identical publish steps. Each package
      # is attempted independently — one failure doesn't cascade-skip the
      # remaining nine (the old structure exited the job on the first
      # failed step, so a transient error on `agentic-ui` blocked all
      # siblings even though they were ready to ship).
      #
      # Exit code: non-zero if ANY targeted package failed to publish, so
      # the workflow's red/green badge still reflects truth. The summary
      # table on the run page lists exactly which ones failed.
      - name: Publish targeted packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PKGS: ${{ steps.target.outputs.pkgs }}
        run: |
          set -u
          declare -A DIRS=(
            ["agentic-ui"]="dist/agentic-ui"
            ["agentic-ui-server"]="projects/agentic-ui-server"
            ["agentic-ui-mcp"]="projects/agentic-ui-mcp"
            ["agentic-ui-copilot-skill"]="projects/agentic-ui-copilot-skill"
            ["agentic-ui-teams-bot"]="projects/agentic-ui-teams-bot"
            ["agentic-ui-m365-agents"]="projects/agentic-ui-m365-agents"
            ["agentic-ui-copilot-studio-connector"]="projects/agentic-ui-copilot-studio-connector"
            ["agentic-ui-server-stores"]="projects/agentic-ui-server-stores"
            ["agentic-ui-server-registrar"]="projects/agentic-ui-server-registrar"
            ["agentic-ui-opa-authorizer"]="projects/agentic-ui-opa-authorizer"
            ["agentic-ui-webmcp"]="projects/agentic-ui-webmcp"
          )

          PUBLISHED=()
          SKIPPED=()
          FAILED=()

          for pkg in $PKGS; do
            dir="${DIRS[$pkg]:-}"
            full="@infra-tools/$pkg"
            echo "::group::$full"
            if [ -z "$dir" ]; then
              echo "::error::Unknown package: $pkg (no directory mapping)"
              FAILED+=("$pkg (unknown)")
              echo "::endgroup::"
              continue
            fi
            if [ ! -f "$dir/package.json" ]; then
              echo "::error::$dir/package.json not found — build step output missing for $full"
              FAILED+=("$full (no build output)")
              echo "::endgroup::"
              continue
            fi
            version=$(node -p "require('./$dir/package.json').version")
            # `npm view <pkg>@<version> version` exits 0 with the version
            # printed when it exists on npm, exits 1 (E404) when either
            # the package or the version is missing. The `&& [ -n "$out" ]`
            # belt-and-suspenders guards against npm changing the exit
            # convention — we only skip on a positive confirmation that
            # this exact version is already published.
            if out=$(npm view "$full@$version" version 2>/dev/null) && [ -n "$out" ]; then
              echo "::notice::$full@$version already on npm — skipping"
              SKIPPED+=("$full@$version")
              echo "::endgroup::"
              continue
            fi
            if [ "$DRY_RUN" = "true" ]; then
              if (cd "$dir" && npm publish --dry-run); then
                PUBLISHED+=("$full@$version (dry-run)")
              else
                echo "::error::Dry-run publish failed for $full@$version"
                FAILED+=("$full@$version")
              fi
            else
              if (cd "$dir" && npm publish); then
                PUBLISHED+=("$full@$version")
              else
                echo "::error::Publish failed for $full@$version"
                FAILED+=("$full@$version")
              fi
            fi
            echo "::endgroup::"
          done

          {
            echo "### Per-package publish results"
            echo ""
            echo "| Status | Count | Packages |"
            echo "|---|---|---|"
            echo "| Published | ${#PUBLISHED[@]} | ${PUBLISHED[*]:-_none_} |"
            echo "| Skipped (already on npm) | ${#SKIPPED[@]} | ${SKIPPED[*]:-_none_} |"
            echo "| Failed | ${#FAILED[@]} | ${FAILED[*]:-_none_} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "::error::${#FAILED[@]} package(s) failed to publish: ${FAILED[*]}"
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### Publish run context"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Trigger | \`${{ github.event_name }}\` |"
            echo "| Targets | \`${{ steps.target.outputs.pkgs }}\` |"
            echo "| Dry run | \`$DRY_RUN\` |"
            echo
            echo "### Versions in this commit"
            echo
            echo "| Package | Version |"
            echo "|---|---|"
            for p in agentic-ui agentic-ui-server agentic-ui-mcp agentic-ui-copilot-skill agentic-ui-teams-bot agentic-ui-m365-agents agentic-ui-copilot-studio-connector agentic-ui-server-stores agentic-ui-server-registrar agentic-ui-opa-authorizer agentic-ui-webmcp; do
              # agentic-ui's manifest is in dist/ after build; the others are
              # at projects/<name>/package.json (no build-time rewrite).
              if [ "$p" = "agentic-ui" ] && [ -f dist/agentic-ui/package.json ]; then
                v=$(node -p "require('./dist/agentic-ui/package.json').version")
              else
                v=$(node -p "require('./projects/$p/package.json').version")
              fi
              echo "| \`@infra-tools/$p\` | \`$v\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
