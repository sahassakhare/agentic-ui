            echo "::notice::@infra-tools/mvk@$v already published — skipping"
          else
            npm publish --access public
          fi

      # --- integration/adapter packages ------------------------------------
      # Standalone tsc packages, each with a `files` allowlist; all verified to
      # build. server-stores depends on file:../agentic-ui-server, whose dist
      # exists by now (built + published above), so its `npm install` resolves.
      - name: Build + publish @infra-tools/agentic-ui-server-stores
        working-directory: projects/agentic-ui-server-stores
        run: |
          npm install --no-audit --fund=false
          npm run build
          v=$(node -p "require('./package.json').version")
          if npm view "@infra-tools/agentic-ui-server-stores@$v" version >/dev/null 2>&1; then
            echo "::notice::@infra-tools/agentic-ui-server-stores@$v already published — skipping"
          else
