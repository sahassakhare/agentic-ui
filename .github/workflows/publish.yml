      - name: Build + publish @infra-tools/agentic-ui-copilot-skill
        working-directory: projects/agentic-ui-copilot-skill
        run: |
          npm install --no-audit --fund=false
          npm run build
          v=$(node -p "require('./package.json').version")
          if npm view "@infra-tools/agentic-ui-copilot-skill@$v" version >/dev/null 2>&1; then
            echo "::notice::@infra-tools/agentic-ui-copilot-skill@$v already published — skipping"
