name: docs

# Publish the TypeDoc API site to GitHub Pages on every release tag (v*)
# and on every push to main. Pages must be enabled for the repo with the
# `GitHub Actions` source.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build TypeDoc site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm
      # Match ci.yml: pin npm to 11.x so the workspace's lockfileVersion-3
      # lockfile (generated by npm 11) reads as in-sync.
      - run: npm install -g npm@11.6.2
      - run: npm ci --no-audit --fund=false
      - run: npm run docs:api
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/api

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
