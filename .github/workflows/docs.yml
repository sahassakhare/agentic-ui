name: docs

# Publish the TypeDoc API site to GitHub Pages.
#
# ── ONE-TIME REPO SETUP ──────────────────────────────────────────────
# Before this workflow can succeed, GitHub Pages must be enabled with
# the "GitHub Actions" source:
#   1. https://github.com/sahassakhare/agentic-ui/settings/pages
#   2. Source: "GitHub Actions" (NOT "Deploy from a branch")
#   3. Save.
# Without this, `actions/configure-pages@v5` fails instantly on every
# run with a 4xx, surfacing as a red mark on every commit.
#
# ── WHEN THIS WORKFLOW RUNS ──────────────────────────────────────────
# Only on tagged releases (v*) and manual dispatch. The previous
# "every push to main" trigger was removed because the missing repo
# setting made every commit show a docs-workflow failure regardless
# of whether the docs change. Once Pages is enabled the trigger can
# be widened back to `push: branches: [main]`.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build TypeDoc site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20.19'
          cache: npm
      # Match ci.yml: pin npm to 11.x so the workspace's lockfileVersion-3
      # lockfile (generated by npm 11) reads as in-sync.
      - run: npm install -g npm@11.6.2
      - run: npm ci --no-audit --fund=false
      - run: npm run docs:api
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/api

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
